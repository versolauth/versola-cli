# Runs go vet/build/test on every push and pull request -- unlike
# release.yml (which only triggers on a version tag, i.e. right before
# publishing), this catches a broken commit on every push/PR, not just the
# one that happens to get tagged.
name: ci

on:
  push:
    branches:
      - main
  pull_request:

# CI only reads the repository: least privilege for GITHUB_TOKEN, written
# down so it holds even if the repository or organization default is
# read-write (CodeQL actions/missing-workflow-permissions). release.yml
# sets its own contents: write.
permissions:
  contents: read

# Same Go as release.yml, see the comment there: the newest 1.26.x with its
# security patches, and no toolchain switching from go.mod.
env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Same pinned-SHA policy as release.yml: floating tags like @v4 are
      # mutable, so third-party actions are pinned to a specific commit.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          check-latest: true

      # CLAUDE.md requires `gofmt -l .` to print nothing before a commit;
      # this makes it a check instead of a convention. (On Linux the
      # checkout has LF line endings, so plain gofmt is accurate here.)
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "not gofmt'ed (fix: gofmt -w <file>):"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Tools are run at a fixed version with `go run pkg@version`, the
      # module counterpart of pinning an action by SHA: the go command
      # verifies the module against the checksum database, and a new release
      # of the tool cannot start failing CI on its own. Bump deliberately.
      # Configuration: staticcheck.conf at the repository root.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      # Fails on a known vulnerability that the code can actually reach,
      # including the standard library of the Go above -- which is what ends
      # up inside the released binaries.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # Cross-compile every release target, same as release.yml's build
      # step -- catches a GOOS/GOARCH-specific compile error (e.g. a
      # windows-only or darwin-only file) on every push, not just at
      # release time.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/versola
          GOOS=darwin  GOARCH=amd64 go build -o /dev/null ./cmd/versola
          GOOS=darwin  GOARCH=arm64 go build -o /dev/null ./cmd/versola
          GOOS=linux   GOARCH=amd64 go build -o /dev/null ./cmd/versola

      - name: Test
        run: go test ./...

      # The SQL script `backup restore` runs (pgRestoreScript) empties the
      # database and commits only when pg_restore finished; its unit tests
      # match text. This runs it against a real postgres:18-alpine (Docker is
      # on the runner): a good dump over a changed database, a truncated
      # dump, garbage. Without VERSOLA_PG_IT=1 the test skips, so the step
      # also fails when the test did not actually pass (a skip is `ok` to go
      # test). Linux only: there are no Linux containers on the Windows job.
      - name: Restore script against a real Postgres
        env:
          VERSOLA_PG_IT: "1"
        run: |
          go test ./internal/deploy -run 'TestPgRestoreScriptAgainstRealPostgres$' -count=1 -timeout 5m -v | tee "$RUNNER_TEMP/pg-restore-it.log"
          grep -q -- '--- PASS: TestPgRestoreScriptAgainstRealPostgres' "$RUNNER_TEMP/pg-restore-it.log"

  # The windows half of the *_unix.go / *_windows.go pairs (docker shield,
  # state lock) is otherwise only compiled, never run. internal/proxy is
  # left out: its tests need symlink privileges and POSIX paths, and the
  # Linux job above covers it (CLAUDE.md, "Commands").
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Test
        shell: bash
        run: go test $(go list ./... | grep -v '/internal/proxy$')
