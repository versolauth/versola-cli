# Generated by versola-cli -- shared proxy_pass settings, included by every
# proxying location in conf.d/versola.conf.

proxy_http_version 1.1;
# $versola_host / $versola_forwarded_proto: see the maps at the top of
# conf.d/versola.conf.
proxy_set_header Host $versola_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $versola_forwarded_proto;
proxy_set_header Connection "";
