    # ---- Routing: copied (the admin console's root aside) from versola's
    # docker/versola-tools/nginx.conf.template (verified against the real
    # auth/central/edge images there and on id.versola.io). Keep the two in
    # step when Versola's routes change -- see the package comment in
    # internal/proxy/proxy.go on why this CLI knows Versola's routes at all.

    client_max_body_size 8m;

    location = /admin {
        return 301 /central/admin/$is_args$args;
    }

    location /admin/ {
        rewrite ^/admin/(.*)$ /central/admin/$1 permanent;
    }

    location = /central {
        return 301 /central/admin/$is_args$args;
    }

    location = /central/ {
        return 301 /central/admin/$is_args$args;
    }

    location = /central/admin {
        return 301 /central/admin/$is_args$args;
    }

    # `root` (not `alias`): the request path /central/admin/... is appended
    # as-is to the root, landing on <root>/central/admin/... -- exactly
    # where central-ui's dist/ is put, and exactly what vite.config.ts bakes
    # into every asset URL in dist/index.html. No rewrite, no separate
    # container. (Versola's own template has /usr/share/nginx/html; on vps
    # the console lives in the proxy's config generation instead -- see
    # package proxy, generation.go -- so the root is filled in here.)
    location /central/admin/ {
        root {{ .HTMLRoot }};
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        # Security headers for what nginx itself serves, the console's static files; the
        # services set theirs on everything proxied below (SecurityHeaders.scala in versola).
        # An add_header in a location replaces every server-level one, so they are repeated
        # here. The four before HSTS are the ones versola's docker/versola-tools/nginx.conf.template
        # sends: keep them identical (its CSP too). HSTS is added here on purpose and not
        # there: that listener is plain http, while this proxy terminates TLS or is told the
        # scheme by the proxy in front of it. $versola_hsts is empty over plain http, and an
        # empty value is not sent.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
        add_header Strict-Transport-Security $versola_hsts always;
    }

    location = /central/permissions/me {
        proxy_pass http://edge_backend/permissions/me;
        include proxy_params.conf;
    }

    location /central/ {
        rewrite ^/central/(.*)$ /resources/central/$1 break;

        proxy_pass http://edge_backend;
        include proxy_params.conf;
    }

    location = /resources {
        proxy_pass http://edge_backend;
        include proxy_params.conf;
    }

    location /resources/ {
        proxy_pass http://edge_backend;
        include proxy_params.conf;
    }

    location = /permissions {
        proxy_pass http://edge_backend;
        include proxy_params.conf;
    }

    location /permissions/ {
        proxy_pass http://edge_backend;
        include proxy_params.conf;
    }

    # OAuth2 / OIDC core endpoints -- these already fall through to the
    # catch-all below since it also points at auth_backend, but are listed
    # explicitly here for clarity/documentation of the surface.
    location = /authorize {
        proxy_pass http://auth_backend;
        include proxy_params.conf;
    }

    location = /token {
        proxy_pass http://auth_backend;
        include proxy_params.conf;
    }

    location = /introspect {
        proxy_pass http://auth_backend;
        include proxy_params.conf;
    }

    location = /revoke {
        proxy_pass http://auth_backend;
        include proxy_params.conf;
    }

    location = /userinfo {
        proxy_pass http://auth_backend;
        include proxy_params.conf;
    }

    location /.well-known/ {
        proxy_pass http://auth_backend;
        include proxy_params.conf;
    }

    # /challenge is the conversation/login-form step API (email, phone,
    # password, otp, passkey, set-password submissions all nest under it).
    location = /challenge {
        proxy_pass http://auth_backend;
        include proxy_params.conf;
    }

    location /challenge/ {
        proxy_pass http://auth_backend;
        include proxy_params.conf;
    }

    location = /login {
        proxy_pass http://edge_backend;
        include proxy_params.conf;
    }

    location /login/ {
        proxy_pass http://edge_backend;
        include proxy_params.conf;
    }

    location = /complete {
        proxy_pass http://edge_backend;
        include proxy_params.conf;
    }

    location = /complete/ {
        proxy_pass http://edge_backend;
        include proxy_params.conf;
    }

    # Bare /logout is auth's RP-initiated logout / end_session_endpoint --
    # hit directly by RPs, and by the browser after edge's redirect below.
    location = /logout {
        proxy_pass http://auth_backend;
        include proxy_params.conf;
    }

    # /logout/{presetId} (preset-scoped, edge-initiated logout) and
    # /logout/frontchannel, /logout/backchannel (OIDC front/back-channel
    # logout notifications from auth) all live on edge, same as /login/.
    location /logout/ {
        proxy_pass http://edge_backend;
        include proxy_params.conf;
    }

    # Everything else stays on auth (OIDC endpoints, login forms, etc.)
    location / {
        proxy_pass http://auth_backend;
        include proxy_params.conf;
    }
