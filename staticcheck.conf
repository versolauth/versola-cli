# staticcheck configuration (run in CI, .github/workflows/ci.yml).
#
# The default set, minus ST1005 ("error strings should not be
# capitalized"). That convention is for errors that get wrapped into a
# longer message; this CLI's errors are mostly the final sentence shown to
# the operator, and they open with a proper noun -- "Versola 0.6.0 doesn't
# ship...", "Docker Compose 2.17 is too old...", "Postgres takes 3 more
# connections..." -- which ST1005 cannot tell from a capitalised word.
checks = ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]
